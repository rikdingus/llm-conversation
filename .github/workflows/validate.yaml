name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"

jobs:
  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master

  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile check
        run: python -m py_compile $(find custom_components scripts -name "*.py")
      - name: Smoke tests
        run: python test_smoke.py
      - name: Setup script against mock Home Assistant
        run: python test_setup_mock.py
      - name: Script self-checks
        # Live API calls need secrets; in CI we only verify the scripts run
        # and parse their arguments.
        run: |
          python scripts/test_realtime.py --help > /dev/null
          python scripts/setup_assist.py --help > /dev/null
